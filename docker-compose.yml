services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: 3224003048_hst_campus_assist
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/3224003048_hst_campus_assist?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      DB_USER: root
      DB_PASS: 123456
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
